# Optional: local Postgres for offline development — and the same setup the
# Hostinger VPS will run later. Start with: docker compose up -d
# Then in .env:
#   DATABASE_URL="postgresql://apna:apna@localhost:5432/apnastore"
#   DATABASE_URL_DIRECT="postgresql://apna:apna@localhost:5432/apnastore"
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apna
      POSTGRES_PASSWORD: apna
      POSTGRES_DB: apnastore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
